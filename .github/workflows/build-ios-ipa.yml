name: Build iOS IPA (Identical to Port 3000 UI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Native iOS .ipa from Port 3000 App on macOS
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Install Dependencies & Build Exact Port 3000 Bundle (dist/)
        run: |
          npm install
          npm run build

      - name: 4. Add Capacitor iOS Native Shell Wrapping dist/
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios --no-save
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 5. Compile Unsigned iOS App via Xcode (xcodebuild)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET="-workspace App.xcworkspace"
          else
            BUILD_TARGET="-project App.xcodeproj"
          fi
          xcodebuild \
            $BUILD_TARGET \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: 6. Package App.app into AuraFinance-iOS.ipa
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found compiled iOS app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qry AuraFinance-iOS.ipa Payload
          ls -lh AuraFinance-iOS.ipa

      - name: 7. Upload AuraFinance-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraFinance-iOS-IPA
          path: ./AuraFinance-iOS.ipa
          retention-days: 30
